<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Dino</title>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="hud" aria-live="polite">
      <span id="hud-level"></span>
      <span id="hud-hint"></span>
    </div>

    <div id="bubble" hidden>
      <div class="bubble-box"><span id="bubble-text"></span></div>
    </div>

    <div id="welcome" class="screen" role="dialog" aria-label="Benvenuto">
      <p class="screen-text">Ciao Annina, il tuo Bik ti da il benvenuto in questo fantastico mondo di dinosauri!</p>
      <p class="screen-hint">(clicca ovunque per continuare)</p>
    </div>

    <div id="finale" class="screen" role="dialog" aria-label="Finale" hidden>
      <p class="screen-text">Livello finale superato! Hai raccolto cuori, uova e dinosauri. Bik ti ama più di tutti i dinosauri messi insieme, Annina!</p>
      <p class="screen-hint">(clicca per rigiocare)</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
