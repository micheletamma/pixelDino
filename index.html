<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Dino</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="hud" aria-live="polite">
      <span id="hud-level"></span>
      <span id="hud-hint"></span>
    </div>

    <div id="bubble" hidden>
      <div class="bubble-box"><span id="bubble-text"></span></div>
    </div>

    <div id="welcome" class="screen" role="dialog" aria-label="Benvenuto">
      <p class="screen-text">Ciao Annina, il tuo Bik ti da il benvenuto in questo fantastico mondo di dinosauri!</p>
    </div>

    <div id="video-screen" class="screen" role="dialog" aria-label="Videomessaggio" hidden>
      <video id="message-video" playsinline controls preload="auto"></video>
      <button id="video-skip" type="button">Salta</button>
    </div>

    <div id="finale" class="screen" role="dialog" aria-label="Finale" hidden>
      <p class="screen-text">Livello finale superato! Bik ti ama più di tutti i dinosauri messi insieme!</p>
      <p class="screen-hint">(clicca per rigiocare)</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
